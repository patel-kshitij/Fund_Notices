[project]
name = "fund-notices"
version = "0.1.0"
description = "Sorts synthetic fund notice PDFs, extracts typed fields, and flags doubtful ones for review."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9,<3",
    "fpdf2==2.8.9",
    "pypdf>=6.20,<7",
    "ollama>=0.6.3,<1",
    "scikit-learn>=1.9.1,<2",
    "sentence-transformers>=6.1.0,<7",
    "pandas>=3.0.6,<4",
    "streamlit[pdf]>=1.65.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fund_notices"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src:scripts"
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

# scikit-learn and pandas ship no type information, so mypy treats them as untyped.
[[tool.mypy.overrides]]
module = ["sklearn.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-q"
